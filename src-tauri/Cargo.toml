[package]
name = "glimmerx"
version = "0.1.2"
description = "A personal double-entry bookkeeping desktop app"
authors = ["you"]
edition = "2021"

[lib]
name = "glimmerx_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
embed-resource = "3"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_with = "3"
rusqlite = { version = "0.39", features = ["bundled-sqlcipher-vendored-openssl"] }
# Keep this pinned: 2.6.0 requires rusqlite ^0.40, which would produce a second
# `Connection` type incompatible with the 0.39 connection used everywhere here.
rusqlite_migration = "=2.5.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
dirs = "6"
itertools = "0.14"
hex = "0.4"
sha2 = "0.10"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }

[dev-dependencies]
tempfile = "3"
tauri = { version = "2", features = ["test"] }
tokio = { version = "1", features = ["macros", "rt"] }
