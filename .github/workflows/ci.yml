name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    name: Frontend (typecheck + lint + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx eslint . --max-warnings=0
      - run: npx prettier --check "src/**/*.{ts,tsx,css,json}"
      - run: python tools/check_docs.py
      - run: npm run test:coverage

  backend:
    name: Backend (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies (Linux only)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libssl-dev libsqlite3-dev \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            libxdo-dev libasound2-dev libfontconfig1-dev libfreetype-dev \
            libgtk-3-dev
      - name: Use Strawberry Perl for vendored OpenSSL (Windows only)
        if: runner.os == 'Windows'
        shell: pwsh
        run: echo "OPENSSL_SRC_PERL=C:/Strawberry/perl/bin/perl.exe" >> $env:GITHUB_ENV
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Format check (Linux only)
        if: runner.os == 'Linux'
        working-directory: src-tauri
        run: cargo fmt -- --check
      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings
      - name: Build
        working-directory: src-tauri
        run: cargo build
      - name: Tests
        working-directory: src-tauri
        run: cargo test

  coverage:
    name: Backend coverage (≥95% lines)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies (Tauri 2 + rusqlite)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libssl-dev libsqlite3-dev \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            libxdo-dev libasound2-dev libfontconfig1-dev libfreetype-dev \
            libgtk-3-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy, llvm-tools-preview
      - uses: taiki-e/install-action@cargo-llvm-cov
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Coverage
        working-directory: src-tauri
        run: cargo llvm-cov --all-targets --fail-under-lines 95
