name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    name: Frontend (typecheck + lint + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx eslint . --max-warnings=0
      - run: npx prettier --check "src/**/*.{ts,tsx,css,json}"
      - run: npx vitest run

  backend:
    name: Backend (fmt + clippy + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies (Tauri 2 + rusqlite)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libssl-dev libsqlite3-dev \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            libxdo-dev libasound2-dev libfontconfig1-dev libfreetype-dev \
            libgtk-3-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Format check
        working-directory: src-tauri
        run: cargo fmt -- --check
      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings
      - name: Tests
        working-directory: src-tauri
        run: cargo test

  coverage:
    name: Backend coverage (≥95% lines)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies (Tauri 2 + rusqlite)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libssl-dev libsqlite3-dev \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            libxdo-dev libasound2-dev libfontconfig1-dev libfreetype-dev \
            libgtk-3-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy, llvm-tools-preview
      - uses: taiki-e/install-action@cargo-llvm-cov
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Coverage
        working-directory: src-tauri
        run: cargo llvm-cov --all-targets --fail-under-lines 95
